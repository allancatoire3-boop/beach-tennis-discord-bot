name: Vérifier les tournois Beach Tennis

on:
  schedule:
    # Une fois par jour. GitHub Actions utilise l'heure UTC.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beach-tennis-daily-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Chercher les nouveaux tournois
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python bot.py

      - name: Enregistrer la liste des tournois déjà vus
        run: |
          if git diff --quiet -- seen_tournaments.json current_tournaments.json; then
            echo "Aucune modification à enregistrer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_tournaments.json current_tournaments.json
          git commit -m "Mémoriser les tournois déjà vus"
          git push
